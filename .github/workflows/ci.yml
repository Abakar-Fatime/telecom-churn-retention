name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild every result from the raw data
        run: python -m churnlab.pipeline
      - name: Tests
        env:
          CHURN_LLM_BACKEND: none
        run: pytest -q
