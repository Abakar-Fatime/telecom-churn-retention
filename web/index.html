<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telecom Churn &amp; Retention</title>
  <meta name="description" content="Churn prediction, survival analysis, next-best-action retention offers and AI-written messages for a telecom operator.">
  <link rel="stylesheet" href="styles.css">
  <script>try { if (localStorage.getItem("tc-theme") === "light") document.documentElement.classList.add("light"); } catch (e) {}</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">TC</div>
      <div><div class="brand-name">Churn &amp; Retention</div><div class="brand-sub">Keep the right customers</div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group">Insights</div>
      <a href="#/" data-route="overview"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Overview</a>
      <a href="#/customers" data-route="customers"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5.5-4.5-6.5"/></svg>At-risk customers</a>
      <div class="nav-group">Action</div>
      <a href="#/campaign" data-route="campaign"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2-8z"/></svg>Campaign planner</a>
      <a href="#/messages" data-route="messages"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>AI messages</a>
      <div class="nav-group">Under the hood</div>
      <a href="#/model" data-route="model"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/></svg>Models &amp; validation</a>
    </nav>
    <div class="sidebar-foot">IBM Telco dataset · 7,043 real customers · offer campaigns simulated</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <form class="ask" id="find-form" autocomplete="off">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="find-input" placeholder="Find a customer by ID, e.g. 7590-VHVEG">
      </form>
      <button class="icon-btn" id="theme-btn" title="Toggle light / dark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>
    <section class="view" id="view"><div class="empty">Loading…</div></section>
  </main>
</div>
<script src="vendor/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
